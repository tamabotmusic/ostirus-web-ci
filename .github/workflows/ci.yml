name: OsTIrus CI (sin firmware)
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Compilar motor nativo TI2 para macOS Apple Silicon"
        required: false
        default: false
        type: boolean
      build_wasm:
        description: "Compilar motor TI2 desde el archivo GPL de μcor"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  source-checks:
    name: Pruebas estáticas y seguridad ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de preparación y privacidad
        run: python -m unittest discover -s tests -v
      - name: Pruebas locales del puente MIDI y privacidad
        run: python -m unittest discover -s hybrid/tests -v
      - name: Validación JavaScript del panel
        run: |
          for file in hybrid/ui/*.js; do node --check "$file"; done
          node --test hybrid/tests/test_dsp_lfo_ui.cjs
          node --test hybrid/tests/test_lfo_select_v15.cjs
          node --test hybrid/tests/test_lfo_integration_v15.cjs
      - name: Sintaxis Python
        run: python -m compileall -q scripts tests hybrid
      - name: Sintaxis shell
        run: bash -n scripts/build_ti2.sh

  build-wasm:
    name: Compilar TI2 (sin ROM)
    needs: source-checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_wasm) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-wasm]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y verificar fuente GPL
        run: python scripts/fetch_ucor_source.py --destination ucor-gearmulator-src-2026-10-07.tar.xz
      - name: Descomprimir fuente verificada
        run: tar -xf ucor-gearmulator-src-2026-10-07.tar.xz
      - name: Seleccionar TI2 y preparar arranque
        run: python scripts/prepare_ti2.py ucor-gearmulator-src-2026-10-07
      - name: Aplicar guardas DSP y colas WASM (sin ROM)
        run: python scripts/patch_wasm_runtime.py ucor-gearmulator-src-2026-10-07/gearmulator
      - name: Instalar Emscripten 5.0.4
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.4"
          actions-cache-folder: "emsdk-cache"
      - name: Compilar WebAssembly
        run: bash scripts/build_ti2.sh ucor-gearmulator-src-2026-10-07/gearmulator build/wasm
      - name: Verificar que el motor WASM arranca sin ROM y que la API responde
        run: node scripts/smoke_wasm_node.cjs --engine-dir build/wasm/source/wasmApi --timeout-ms 10000
      - name: Publicar solo artefactos del compilador
        uses: actions/upload-artifact@v4
        with:
          name: ostirus-engine-ti2-sin-rom
          path: |
            build/wasm/source/wasmApi/ostirus_engine.js
            build/wasm/source/wasmApi/ostirus_engine.wasm
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Motor nativo TI2 macOS arm64 (sin ROM)
    needs: source-checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_macos) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-mac]')) }}
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar fuente GPL y verificar SHA-256
        run: python scripts/fetch_ucor_source.py --destination ucor-gearmulator-src-2026-10-07.tar.xz
      - name: Descomprimir fuente verificada
        run: tar -xf ucor-gearmulator-src-2026-10-07.tar.xz
      - name: Compilar núcleo nativo con PortAudio / CoreAudio
        run: bash scripts/build_native_mac.sh ucor-gearmulator-src-2026-10-07/gearmulator build/mac-native
      - name: Verificar que el motor exige firmware local
        shell: bash
        run: |
          test -s build/mac-native/source/ostirus_native_bridge
          file build/mac-native/source/ostirus_native_bridge | grep -q 'arm64'
          if build/mac-native/source/ostirus_native_bridge --rom /this/file/does/not/exist.bin --probe >probe.stdout 2>probe.stderr; then
            echo 'ERROR: motor arrancó sin ROM'; exit 1
          fi
          grep -q 'Cannot read ROM file' probe.stderr
      - name: Publicar solo binario nativo (sin firmware)
        uses: actions/upload-artifact@v4
        with:
          name: ostirus-native-macos-arm64-sin-rom
          path: build/mac-native/source/ostirus_native_bridge
          if-no-files-found: error
          retention-days: 7
