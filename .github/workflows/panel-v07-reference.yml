name: OsTIrus TI2 v0.7 geometric checks (NO RELEASE)

on:
  push:
    branches:
      - feature/ti2-frontpanel-v07-reference
    paths:
      - 'hybrid/reference/TI2_V07_*'
      - 'hybrid/tests/test_ti2_v07_reference.py'
      - '.github/workflows/panel-v07-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify geometry and physical inventory without ROM
        run: python -m unittest discover -s hybrid/tests -p test_ti2_v07_reference.py -v
      - name: Check release gate
        run: |
          echo 'Status: NOT APPROVED for distribution.'
          test ! -f hybrid/ui/ti2-v07-release-approved.flag
