name: OsTIrus Native Apple Silicon (sin firmware)

on:
  workflow_dispatch:
  push:
    paths:
      - 'hybrid/**'
      - '.github/workflows/native-mac.yml'

permissions:
  contents: read

jobs:
  native-arm64:
    name: Compilar host TI2 CoreAudio (arm64)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-build]')) }}
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar preparación nativa sin ROM
        run: python -m unittest discover -s hybrid/tests -v
      - name: Comprobar sintaxis JavaScript y Python
        run: |
          python -m compileall -q hybrid
          node --check hybrid/ui/app.js
      - name: Obtener fuentes GPL verificadas
        run: python scripts/fetch_ucor_source.py --destination source-snapshot.tar.xz
      - name: Descomprimir fuentes
        run: tar -xf source-snapshot.tar.xz
      - name: Preparar compilación nativa
        run: python hybrid/scripts/prepare_native_headless.py ucor-gearmulator-src-2026-10-07/gearmulator
      - name: Configurar host nativo
        run: |
          cmake -S ucor-gearmulator-src-2026-10-07/gearmulator -B build/native -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -Dgearmulator_BUILD_JUCEPLUGIN=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_CLAP=OFF \
            -Dgearmulator_SYNTH_VAVRA=OFF \
            -Dgearmulator_SYNTH_XENIA=OFF \
            -Dgearmulator_SYNTH_NODALRED2X=OFF \
            -Dgearmulator_SYNTH_JE8086=OFF \
            -DOSTIRUS_NATIVE_HOST_SOURCE="$GITHUB_WORKSPACE/hybrid/native/ostirus_native_host.cpp"
      - name: Compilar
        run: cmake --build build/native --target ostirus_native_host --parallel 4
      - name: Verificar arquitectura Apple Silicon y binario
        run: |
          test -s build/native/ostirus_native_host
          file build/native/ostirus_native_host
          lipo -archs build/native/ostirus_native_host | grep -qw arm64
          shasum -a 256 build/native/ostirus_native_host
      - name: Empaquetar aplicación local sin firmware
        run: |
          mkdir -p dist/OsTIrus_Web_Nativo/bin dist/OsTIrus_Web_Nativo/ui
          cp build/native/ostirus_native_host dist/OsTIrus_Web_Nativo/bin/
          cp hybrid/server.py dist/OsTIrus_Web_Nativo/
          cp hybrid/ui/index.html hybrid/ui/style.css hybrid/ui/app.js dist/OsTIrus_Web_Nativo/ui/
          cp hybrid/ABRIR_OSTIRUS_WEB.command hybrid/LEEME.md dist/OsTIrus_Web_Nativo/
          chmod 755 dist/OsTIrus_Web_Nativo/bin/ostirus_native_host
          chmod 755 dist/OsTIrus_Web_Nativo/ABRIR_OSTIRUS_WEB.command
          ditto -c -k --keepParent dist/OsTIrus_Web_Nativo dist/OsTIrus_Web_Nativo.zip
          test -s dist/OsTIrus_Web_Nativo.zip
          unzip -l dist/OsTIrus_Web_Nativo.zip
      - name: Guardar paquete experimental completo sin ROM
        uses: actions/upload-artifact@v4
        with:
          name: ostirus-web-nativo-macos
          path: dist/OsTIrus_Web_Nativo.zip
          if-no-files-found: error
          retention-days: 7
